[package]
name = "implant"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "implant"
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
